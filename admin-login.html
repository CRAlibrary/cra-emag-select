<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRA eMag Select | Admin Login</title>
    
    <!-- Google Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-blue-600 px-6 py-8 text-center">
            <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-2xl">
                <i class="fas fa-user-shield"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">Admin Portal</h1>
            <p class="text-blue-100 text-sm mt-1">ระบบจัดการหลังบ้าน CRA eMag Select</p>
        </div>

        <!-- Form -->
        <div class="p-8">
            <form id="adminLoginForm" onsubmit="handleLogin(event)" class="space-y-5">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-user"></i>
                        </div>
                        <input type="text" id="username" required class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm" placeholder="กรอกชื่อผู้ใช้">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="password" required class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm" placeholder="กรอกรหัสผ่าน">
                    </div>
                </div>

                <!-- Error Message Container -->
                <div id="errorMsg" class="hidden bg-red-50 text-red-500 text-sm p-3 rounded-lg flex items-center gap-2">
                    <i class="fas fa-exclamation-circle"></i> <span id="errorText">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
                </div>

                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition duration-150 ease-in-out shadow-sm flex justify-center items-center gap-2 mt-4">
                    <span>เข้าสู่ระบบ</span>
                    <i class="fas fa-sign-in-alt"></i>
                </button>
                
                <div class="text-center mt-6">
                    <a href="javascript:goToIndex()" class="text-sm text-gray-400 hover:text-blue-600 transition">
                        <i class="fas fa-arrow-left mr-1"></i> กลับไปหน้าหลักผู้ใช้
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const DEV_URL = "https://script.google.com/macros/s/AKfycbxIkboZlFSaH9o-CJY18VtTcPgUpww-VzHcxdBw5Qdk/dev";

        // ฟังก์ชันกลับหน้าแรก
        function goToIndex() {
            window.top.location.href = DEV_URL + "?page=index";
        }

        function handleLogin(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            
            // เปลี่ยนสถานะปุ่ม
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบ...';
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            errorMsg.classList.add('hidden');

            // เรียกใช้ฟังก์ชัน authenticateAdmin ใน AdminService.gs
            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        // จำลองการเก็บ Session แอดมินไว้ใน LocalStorage
                        localStorage.setItem('cra_admin_token', 'authenticated_' + new Date().getTime());
                        // เปลี่ยนไปหน้า Dashboard
                        window.top.location.href = DEV_URL + "?page=dashboard";
                    } else {
                        // กรณีรหัสผิด
                        errorText.innerText = response.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
                        errorMsg.classList.remove('hidden');
                        resetButton();
                    }
                })
                .withFailureHandler(function(error) {
                    errorText.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
                    errorMsg.classList.remove('hidden');
                    resetButton();
                })
                .authenticateAdmin(user, pass);
        }

        function resetButton() {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span>เข้าสู่ระบบ</span> <i class="fas fa-sign-in-alt"></i>';
            btn.disabled = false;
            btn.classList.remove('opacity-70', 'cursor-not-allowed');
        }
    </script>
</body>
</html>
