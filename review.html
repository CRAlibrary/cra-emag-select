<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRA eMag Select | ตรวจสอบรายการ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header & Progress -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold">C</div>
                    <span class="font-bold text-gray-800 hidden sm:block">CRA <span class="text-blue-600 font-normal">eMag Select</span></span>
                </div>

                <nav aria-label="Progress">
                    <ol role="list" class="flex items-center space-x-2 sm:space-x-4">
                        <li class="flex items-center"><span class="flex items-center text-sm font-medium text-gray-500"><span class="flex h-6 w-6 items-center justify-center rounded-full bg-green-500 text-white mr-1 sm:mr-2"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg></span><span class="hidden sm:inline">01 ลงทะเบียน</span></span></li>
                        <li class="hidden sm:flex text-gray-300"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg></li>
                        <li class="flex items-center"><span class="flex items-center text-sm font-medium text-gray-500"><span class="flex h-6 w-6 items-center justify-center rounded-full bg-green-500 text-white mr-1 sm:mr-2"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg></span><span class="hidden sm:inline">02 คัดเลือก</span></span></li>
                        <li class="hidden sm:flex text-gray-300"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg></li>
                        <li class="flex items-center"><span class="flex items-center text-sm font-medium text-blue-600 bg-blue-50 px-2 sm:px-3 py-1 rounded-full">03 ตรวจสอบ</span></li>
                        <li class="hidden sm:flex text-gray-300"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg></li>
                        <li class="flex items-center"><span class="flex items-center text-sm font-medium text-gray-400">04 เสร็จสิ้น</span></li>
                    </ol>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-4 sm:px-6 py-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">ตรวจสอบรายการที่เลือก</h1>

        <!-- User Info Summary -->
        <div class="bg-white rounded-xl shadow-sm border p-6 mb-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">ข้อมูลผู้คัดเลือก</h2>
            <div id="userInfoDisplay" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm text-gray-700">
                <!-- Data will be injected here via JS -->
            </div>
        </div>

        <!-- Selected Magazines Summary -->
        <div class="bg-white rounded-xl shadow-sm border p-6 mb-8">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">รายการนิตยสาร (<span id="totalItems">0</span> รายการ)</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead>
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">ลำดับ</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">ชื่อนิตยสาร</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">หมวดหมู่</th>
                            <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">ราคา (บาท)</th>
                        </tr>
                    </thead>
                    <tbody id="cartItemsList" class="divide-y divide-gray-200 bg-white">
                        <!-- Items injected here via JS -->
                    </tbody>
                    <tfoot>
                        <tr class="bg-gray-50 font-bold">
                            <td colspan="3" class="px-4 py-4 text-right text-gray-800">ยอดรวมทั้งหมด</td>
                            <td id="totalPrice" class="px-4 py-4 text-right text-blue-600 text-lg">0.00</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-between">
            <button onclick="goBack()" class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition w-full sm:w-auto font-medium">
                กลับไปแก้ไขรายการ
            </button>
            <button id="submitBtn" onclick="submitData()" class="px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition shadow-md w-full sm:w-auto font-medium">
                ยืนยันและส่งข้อมูล
            </button>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loader" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
        <p class="text-gray-700 font-medium">กำลังบันทึกข้อมูลลง Google Sheet...</p>
    </div>

 <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxWqJMu2kgMFqs_7x-RfjUyRuO1Y86ZQJQUeCEqoCv4NKtBDejG3XN7n0z0dLnGymBbAw/exec";
        
        let cartData = [];
        let userData = {};

        window.onload = function() { loadData(); };

        function loadData() {
            const savedUser = localStorage.getItem('cra_user_info');
            if (savedUser) {
                userData = JSON.parse(savedUser);
                document.getElementById('userInfoDisplay').innerHTML = `
                    <p><span class="font-medium">ชื่อ-นามสกุล:</span> ${userData.name || '-'}</p>
                    <p><span class="font-medium">อีเมล:</span> ${userData.email || '-'}</p>
                    <p><span class="font-medium">ประเภทผู้ใช้งาน:</span> ${userData.userType || '-'}</p>
                    <p><span class="font-medium">หน่วยงาน/คณะ:</span> ${userData.department || '-'}</p>
                `;
            }

            const savedCart = localStorage.getItem('cra_selected_mags');
            if (savedCart) {
                cartData = JSON.parse(savedCart);
                document.getElementById('totalItems').innerText = cartData.length;
                
                const tbody = document.getElementById('cartItemsList');
                let total = 0;
                let html = '';

                cartData.forEach((mag, index) => {
                    total += mag.price || 0;
                    html += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3 text-sm text-gray-500">${index + 1}</td>
                            <td class="px-4 py-3 text-sm font-medium text-gray-800">${mag.title}</td>
                            <td class="px-4 py-3 text-sm text-gray-500">${mag.category}</td>
                            <td class="px-4 py-3 text-sm text-gray-800 text-right">${(mag.price || 0).toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
                document.getElementById('totalPrice').innerText = total.toLocaleString('th-TH', {minimumFractionDigits: 2});
            }
        }

        function goBack() {
            window.location.href = 'select.html';
        }

        function submitData() {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('loader').classList.add('flex');
            document.getElementById('submitBtn').disabled = true;

            const payload = {
                user: userData,
                items: cartData,
                totalItems: cartData.length,
                totalPrice: cartData.reduce((sum, item) => sum + (item.price || 0), 0)
            };

            fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'saveSelection', data: payload }),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            })
            .then(res => res.json())
            .then(result => {
                if(result.success) {
                    localStorage.removeItem('cra_selected_mags');
                    window.location.href = 'success.html';
                } else {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('loader').classList.remove('flex');
                    document.getElementById('submitBtn').disabled = false;
                    alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + result.message);
                }
            })
            .catch(error => {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('loader').classList.remove('flex');
                document.getElementById('submitBtn').disabled = false;
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์');
            });
        }
    </script>
</body>
</html>
